spring.application.name=genggam-api
server.port=${PORT:8193}

# ===== DataSource =====
# Lokal pakai default; di Railway/Render set ENV: DB_URL, DB_USER, DB_PASS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/genggam}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:gajah}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ganti-dengan-secret-acak-minimal-32-karakter-genggam}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# ===== File Upload =====
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8193/uploads}
spring.servlet.multipart.max-file-size=200KB
spring.servlet.multipart.max-request-size=1MB

# ===== Jackson =====
spring.jackson.default-property-inclusion=ALWAYS
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.main.banner-mode=off
